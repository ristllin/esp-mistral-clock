; Mistral weather clock: Waveshare ESP32-C6-Touch-LCD-1.47 (ESP32-C6FH8, 8 MB flash)
; Framework: ESP-IDF 5.5 + LVGL 9.3
;
; Build with PlatformIO Core 6.2 or newer (`pio run -t upload`). Older Core
; releases ship a SCons that cannot build this platform.

[env:esp32-c6-touch-lcd-1-47]
; Pinned: the tested pioarduino platform (ESP-IDF 5.5.4). Component versions
; are pinned by dependencies.lock.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c6-devkitm-1
framework = espidf
; The board is an ESP32-C6FH8 with 8 MB embedded flash (the devkitm-1 manifest says 4 MB).
board_upload.flash_size = 8MB
; Custom partition table (4 MB factory app + coredump). Without this line the
; PlatformIO ESP-IDF builder flashes the framework's 1 MB single-app table.
board_build.partitions = partitions.csv
; The board's native USB-Serial/JTAG port is auto-detected. To pin it, add
; upload_port / monitor_port (for example /dev/cu.usbmodem1101 or COM5).
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCLOCK_FW_VERSION=\"1.0.0\"
    -DLV_LVGL_H_INCLUDE_SIMPLE
